name: contract-drift

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract-drift:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Verify deterministic C0 contracts
        run: >-
          nix develop path:.
          --command just --justfile scripts/tasks/task-3b/mod.just check
