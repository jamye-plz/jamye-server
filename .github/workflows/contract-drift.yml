name: contract-drift

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * 1'

permissions: {}

jobs:
  ci:
    name: contract-drift
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JAMYE_TEST_CONTAINER_ENGINE: docker
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Prepare test services and MinIO policy
        run: |
          nix develop . --command bash -euo pipefail -c '
            just env-create
            just infra-up
            just minio-policy
          '

      - name: Run service-backed checks
        run: |
          nix develop . --command bash -euo pipefail -c '
            cargo fetch --locked
            just check
          '

  advisory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Check dependency advisories
        continue-on-error: true
        run: nix develop . --command just dependency-check

      - name: Check for secrets
        continue-on-error: true
        run: nix develop . --command just secret-check

  dispatch:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send repository_dispatch to smg1024/homelab
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_PAT }}
        run: gh api repos/smg1024/homelab/dispatches -f event_type=jamye-server-updated
