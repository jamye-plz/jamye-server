# Local disposable integration-test infrastructure only.
# Production PostgreSQL, Redis, MinIO, credentials, and volumes are owned by
# homelab. Never deploy this Compose project to a server.
name: jamye-server-test

services:
  postgres:
    image: docker.io/library/postgres:17.11-bookworm
    restart: "no"
    environment:
      POSTGRES_DB: jamye_test
      POSTGRES_USER: jamye_test
      POSTGRES_PASSWORD: ${JAMYE_TEST_POSTGRES_PASSWORD:?set by the task-1 local-env card}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jamye_test -d jamye_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: docker.io/library/redis:8.10.1-alpine3.23
    restart: "no"
    environment:
      JAMYE_TEST_REDIS_PASSWORD: ${JAMYE_TEST_REDIS_PASSWORD:?set by the task-1 local-env card}
    command:
      - sh
      - -euc
      - exec redis-server --save '' --appendonly no --requirepass "$$JAMYE_TEST_REDIS_PASSWORD"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$JAMYE_TEST_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${JAMYE_TEST_MINIO_ADMIN_USER:?set by the task-1 local-env card}
      MINIO_ROOT_PASSWORD: ${JAMYE_TEST_MINIO_ADMIN_PASSWORD:?set by the task-1 local-env card}
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
    name: jamye-server-test-postgres-data
  redis-data:
    name: jamye-server-test-redis-data
  minio-data:
    name: jamye-server-test-minio-data
